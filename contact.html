<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обратная связь — Shinenovell</title>
    <meta name="description" content="Форма обратной связи для вопросов об игре «Проклятие подобных».">
    <link rel="icon" href="https://i.ibb.co/B5T3gH4J/unnamed.webp" type="image/webp">
  </head>
  <body>
    <header>
      <a href="#content">Перейти к содержанию</a>
      <h1 style="color: #660fe1;">Обратная связь</h1>
      <nav aria-label="Основная навигация">
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="contact.html" aria-current="page">Обратная связь</a></li>
        </ul>
      </nav>
    </header>
    <main id="content">
      <section>
        <h2>Есть вопрос?</h2>
        <form>
          <p>
            <label for="name">Имя (обязательное поле)</label>
            <input type="text" id="name" name="name" autocomplete="name" required minlength="2">
          </p>
          <p>
            <label for="email">Электронная почта (обязательное поле)</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </p>
          <p>
            <label for="phone">Телефон в формате +7XXXXXXXXXX</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="\+7[0-9]{10}" title="Знак + и 11 цифр без пробелов, например +79001234567">
          </p>
          <p>
            <label for="date">Дата обращения</label>
            <input type="date" id="date" name="date" min="2026-10-01" max="2026-12-25">
          </p>
          <p>
            <label for="format">Тип обращения</label>
            <select id="format" name="format">
              <option value="bug">Нашел ошибку</option>
              <option value="help">Вопрос по игре</option>
              <option value="feedback">Идея или предложение</option>
            </select>
          </p>
          <p>
            <label for="topic">Что именно случилось?</label>
            <input type="text" id="topic" name="topic" list="topics" placeholder="Выберите или впишите свой вариант">
            <datalist id="topics">
              <option value="Не нажимается кнопка"></option>
              <option value="Опечатка или ошибка в тексте"></option>
              <option value="Не понимаю, как пройти место"></option>
              <option value="Проблема с графикой"></option>
              <option value="Другое"></option>
            </datalist>
          </p>
          <fieldset>
            <legend>Проблема...</legend>
            <label><input type="radio" name="time" value="morning" checked> Мешает прохождению</label>
            <label><input type="radio" name="time" value="evening"> Не мешает прохождению</label>
          </fieldset>
          <p>
            <label for="message">Вопрос, не больше 500 знаков</label>
            <textarea id="message" name="message" rows="4" maxlength="500"></textarea>
          </p>
          <button type="submit">Отправить</button>
        </form>
      </section>
    </main>
    <footer>
      <p><a href="index.html">Вернуться на главную</a></p>
      <p><span aria-hidden="true">✉</span> Связаться с разработчиком: <a href="mailto:shinenovell@gmail.com">shinenovell@gmail.com</a></p>
    </footer>
  </body>
</html>
